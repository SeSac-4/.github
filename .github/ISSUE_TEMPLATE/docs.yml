name: docs
description: README, API 문서, 가이드 등 문서 작업
title: "[docs] "
labels: ["docs"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - front
        - back
        - infra
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 대상 문서
      description: 작성하거나 수정할 문서를 적어주세요. (예: README, API 명세, 설치 가이드)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 작업 목록
      value: |
        - [ ] 
        - [ ] 
