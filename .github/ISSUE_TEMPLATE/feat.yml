name: feat
description: 새로운 기능 개발
title: "[feat] "
labels: ["feat"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - front
        - back
        - infra
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 어떤 기능인지, 왜 필요한지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 작업 목록
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 사항
      description: 관련 문서, 디자인, 링크 등 (선택)
